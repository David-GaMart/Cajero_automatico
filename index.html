<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="./script.js" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>
    <link rel="shortcut icon" href="./assets/atm.svg" />
    <link rel="./style.css" href="style.css">
    <title>Cajero Automatico</title>
</head>
<body class="container">
    <header class="mb-3">
        <nav class="navbar bg-info">
            <div class="container-fluid  justify-content-center">
                <a class="navbar-brand text-light" href="#">
                    <img src="./assets/atm.svg" alt="Logo" width="30" height="24" class="d-inline-block align-text-top">
                    Banca mexicana -ATM-
                </a>
            </div>
        </nav>
    </header>
    <main>
        <article class="container">
            <h1 class="d-flex justify-content-center">Bienvenido a la banca mexicana </h1>
            <h1 class="d-flex justify-content-center mb-3"><P></P>Ingrese su cuenta en el siguiente apartado</h1>
            <div id="box" class="d-flex justify-content-center">
                <form class="row g-3" id="login">
                    <div class="col-auto">
                        <label for="username" class="visually-hidden">Nombre de usuario</label>
                        <input type="text" class="form-control-plaintext" id="username" placeholder="Nombre de usuario">
                    </div>
                    <div class="col-auto">
                        <label for="password" class="visually-hidden">Contraseña</label>
                        <input type="password" class="form-control" id="password" placeholder="contraseña">
                    </div>
                    <div class="col-auto">
                        <button type="button" class="btn btn-primary mb-3" id="start">Iniciar sesion</button>
                    </div>
                </form>
            </div>
            <div id="login-message">
            </div>
        </article>
        <article id="process">
            <div id="account">
            </div>
            <div id="manage">
                <button id="inBalance" class="btn btn-secondary">Ingreso a cuenta</button>
                <button id="outBalance" class="btn btn-secondary">Retiro de dinero</button>
            </div>
            <div id="in">
                <form>
                    <label for="text">Su total a ingresar</label>
                    <input type="text" id="inm"></input>
                    <button class="btn btn-info">Aceptar</button>
                </form>
            </div>
            <div>
                <form id="out">
                    <label for="text">Su total a retirar</label>
                    <input type="text" id="outm"></input>
                    <button class="btn btn-info">Aceptar</button>
                </form>
            </div>
        </article>
        <article id="lastBox">
            <div id="result">
            </div>
            <div id="again">
                <button class="btn btn-success">Realizar otra operacion</button>
            </div>
        </article>
    </main>
    <footer id="ended">
        <button id="reload" class="btn btn-danger">Finalizar operacion</button>
    </footer>
</body>
</html>
